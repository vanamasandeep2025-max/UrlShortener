worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    charset_types text/html text/css application/javascript application/json;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 512;

    limit_req_zone $binary_remote_addr zone=redirect_zone:10m rate=50r/s;

    upstream backend_upstream {
        server backend:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Real client IP -> backend (backend's ClientIpResolver reads these).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # REST API -> Spring Boot backend.
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_read_timeout 10s;
        }

        # OpenAPI/Swagger UI -> backend.
        location ~ ^/(v3/api-docs|swagger-ui) {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
        }

        # Frontend static assets served directly; anything that isn't a real file
        # (i.e. a short code) falls through to the backend's redirect endpoint.
        location / {
            limit_req zone=redirect_zone burst=100 nodelay;
            try_files $uri $uri/ @redirect_backend;
        }

        location @redirect_backend {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_read_timeout 10s;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
