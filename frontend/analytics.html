<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics - URL Shortener Platform</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand bg-white border-bottom mb-4">
  <div class="container">
    <a href="index.html" class="navbar-brand text-decoration-none">URL Shortener Platform</a>
    <a href="index.html" class="btn btn-sm btn-outline-secondary">&larr; Back to links</a>
  </div>
</nav>

<div class="container pb-5">
  <h2 class="h5 mb-3">Analytics for <code id="shortCodeLabel">...</code></h2>

  <div class="row g-3 mb-3">
    <div class="col-6 col-md-3">
      <div class="card"><div class="card-body">
        <div class="text-muted-small">Total clicks</div>
        <div class="fs-3 fw-bold" id="totalClicks">-</div>
      </div></div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card"><div class="card-body">
        <div class="text-muted-small">Unique visitors</div>
        <div class="fs-3 fw-bold" id="uniqueVisitors">-</div>
      </div></div>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <div class="card"><div class="card-body">
        <h3 class="h6">Daily clicks</h3>
        <div id="dailyClicksChart"><p class="text-muted-small">No data yet</p></div>
      </div></div>
    </div>
    <div class="col-md-6">
      <div class="card"><div class="card-body">
        <h3 class="h6">Browsers</h3>
        <div id="browsersChart"><p class="text-muted-small">No data yet</p></div>
      </div></div>
    </div>
    <div class="col-md-6">
      <div class="card"><div class="card-body">
        <h3 class="h6">Operating systems</h3>
        <div id="osChart"><p class="text-muted-small">No data yet</p></div>
      </div></div>
    </div>
    <div class="col-md-6">
      <div class="card"><div class="card-body">
        <h3 class="h6">Device types</h3>
        <div id="deviceChart"><p class="text-muted-small">No data yet</p></div>
      </div></div>
    </div>
    <div class="col-md-6">
      <div class="card"><div class="card-body">
        <h3 class="h6">Countries</h3>
        <div id="countryChart"><p class="text-muted-small">No data yet</p></div>
      </div></div>
    </div>
    <div class="col-md-6">
      <div class="card"><div class="card-body">
        <h3 class="h6">Referrers</h3>
        <div id="referrerChart"><p class="text-muted-small">No data yet</p></div>
      </div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
