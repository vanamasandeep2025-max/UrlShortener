<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL Shortener Platform</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand bg-white border-bottom mb-4">
  <div class="container">
    <span class="navbar-brand">URL Shortener Platform</span>
    <div class="d-flex align-items-center gap-3">
      <span class="text-muted-small" id="currentUserLabel"></span>
      <a href="api-keys.html" class="btn btn-sm btn-outline-secondary">API Keys</a>
      <button class="btn btn-sm btn-outline-danger" id="logoutBtn">Sign out</button>
    </div>
  </div>
</nav>

<div class="container pb-5">
  <div class="card mb-4">
    <div class="card-body">
      <h2 class="h5 mb-3">Shorten a URL</h2>
      <form id="createForm" class="row g-2 align-items-start">
        <div class="col-12 col-md-5">
          <input type="url" class="form-control" id="urlInput" placeholder="https://example.com/very/long/link" required>
        </div>
        <div class="col-6 col-md-3">
          <input type="datetime-local" class="form-control" id="expiryInput" title="Optional expiry date/time">
        </div>
        <div class="col-6 col-md-2">
          <input type="password" class="form-control" id="passwordInput" placeholder="Optional password" autocomplete="new-password">
        </div>
        <div class="col-12 col-md-2">
          <button type="submit" class="btn brand-btn text-white w-100">Shorten</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">Your links</h2>
        <div class="d-flex gap-2">
          <select class="form-select form-select-sm" id="statusFilter">
            <option value="ALL">All statuses</option>
            <option value="ACTIVE">Active</option>
            <option value="EXPIRED">Expired</option>
          </select>
          <input type="search" class="form-control form-control-sm" id="searchInput" placeholder="Search...">
        </div>
      </div>

      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Short URL</th>
              <th>Destination</th>
              <th>Clicks</th>
              <th>Created</th>
              <th>Expires</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="urlsTableBody">
            <tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr>
          </tbody>
        </table>
      </div>

      <nav>
        <ul class="pagination pagination-sm justify-content-end mb-0" id="pagination"></ul>
      </nav>
    </div>
  </div>
</div>

<!-- Edit expiry modal -->
<div class="modal fade" id="expiryModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Update expiry</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label">New expiry (leave blank to remove expiry)</label>
        <input type="datetime-local" class="form-control" id="expiryModalInput">
        <input type="hidden" id="expiryModalUrlId">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn brand-btn text-white" id="saveExpiryBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
