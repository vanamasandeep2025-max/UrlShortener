<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Keys - URL Shortener Platform</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand bg-white border-bottom mb-4">
  <div class="container">
    <a href="index.html" class="navbar-brand text-decoration-none">URL Shortener Platform</a>
    <a href="index.html" class="btn btn-sm btn-outline-secondary">&larr; Back to links</a>
  </div>
</nav>

<div class="container pb-5">
  <div class="card mb-4">
    <div class="card-body">
      <h2 class="h5 mb-3">Create an API key</h2>
      <form id="createKeyForm" class="row g-2">
        <div class="col-md-8">
          <input type="text" class="form-control" id="keyName" placeholder="Key name (e.g. CI pipeline)" required>
        </div>
        <div class="col-md-4">
          <button type="submit" class="btn brand-btn text-white w-100">Create key</button>
        </div>
      </form>
      <div id="newKeyAlert" class="alert alert-success mt-3 d-none"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h2 class="h5 mb-3">Your API keys</h2>
      <table class="table align-middle">
        <thead>
          <tr>
            <th>Name</th>
            <th>Prefix</th>
            <th>Scopes</th>
            <th>Last used</th>
            <th>Created</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="keysTableBody">
          <tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/api-keys.js"></script>
</body>
</html>
