<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password protected link - URL Shortener Platform</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-sm" style="width: 100%; max-width: 420px;">
    <div class="card-body p-4 text-center">
      <h1 class="h5 mb-1">This link is password protected</h1>
      <p class="text-muted-small mb-4">Enter the password to continue to the destination.</p>
      <form id="verifyForm">
        <input type="password" class="form-control mb-3" id="linkPassword" placeholder="Password" required autofocus>
        <button type="submit" class="btn brand-btn text-white w-100">Continue</button>
      </form>
      <div id="errorMsg" class="text-danger text-muted-small mt-3 d-none">Incorrect password. Try again.</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/protected.js"></script>
</body>
</html>
