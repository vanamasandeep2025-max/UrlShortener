<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - URL Shortener Platform</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-sm" style="width: 100%; max-width: 420px;">
    <div class="card-body p-4">
      <h1 class="h4 mb-1 text-center">URL Shortener Platform</h1>
      <p class="text-muted text-center mb-4">Sign in or create an account</p>

      <ul class="nav nav-pills nav-justified mb-3" id="authTabs">
        <li class="nav-item">
          <button class="nav-link active" data-tab="login" type="button">Sign in</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-tab="register" type="button">Register</button>
        </li>
      </ul>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" id="loginUsername" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="loginPassword" required>
        </div>
        <button type="submit" class="btn brand-btn text-white w-100">Sign in</button>
        <p class="text-muted-small mt-3 mb-0">Demo accounts: <code>demo</code>/<code>Demo@12345</code> or <code>admin</code>/<code>Admin@12345</code></p>
      </form>

      <form id="registerForm" class="d-none">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" id="registerUsername" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="registerEmail" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="registerPassword" required>
          <div class="form-text">At least 8 characters, with upper, lower and a digit.</div>
        </div>
        <button type="submit" class="btn brand-btn text-white w-100">Create account</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
