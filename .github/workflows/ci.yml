name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile
        run: mvn -B -DskipTests compile

  static-analysis:
    name: Static Analysis (Checkstyle, PMD, SpotBugs)
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Checkstyle
        run: mvn -B checkstyle:check
      - name: PMD
        run: mvn -B pmd:check
      - name: SpotBugs
        run: mvn -B compile test-compile com.github.spotbugs:spotbugs-maven-plugin:check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit tests
        run: mvn -B test jacoco:report
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
      - name: Upload surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  integration-tests:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers manages its own Postgres/Redis/Kafka containers via the Docker
      # daemon already present on GitHub-hosted runners - no `services:` block needed.
      - name: Run integration tests
        run: mvn -B verify -Dcheckstyle.skip=true -Dpmd.skip=true -Dspotbugs.skip=true
      - name: Upload failsafe reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failsafe-reports
          path: backend/target/failsafe-reports

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [static-analysis, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: url-shortener-platform-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
