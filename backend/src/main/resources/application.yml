server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: url-shortener-platform
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:urlshortener}
    username: ${POSTGRES_USER:urlshortener}
    password: ${POSTGRES_PASSWORD:urlshortener}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: url-shortener-hikari
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 30
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 10
        delivery.timeout.ms: 30000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: url-shortener-analytics-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.urlshortener.events
        isolation.level: read_committed
    listener:
      ack-mode: MANUAL_IMMEDIATE
      missing-topics-fatal: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  short-code:
    length: ${SHORT_CODE_LENGTH:7}
    max-generation-attempts: 5
    strategy: ${SHORT_CODE_STRATEGY:random}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-key-please-override-in-prod-min-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000}
    issuer: url-shortener-platform
  rate-limit:
    default-capacity: ${RATE_LIMIT_DEFAULT_CAPACITY:100}
    default-refill-seconds: ${RATE_LIMIT_DEFAULT_REFILL_SECONDS:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:3000}
  kafka:
    topics:
      url-created: url-created
      url-clicked: url-clicked
      analytics: analytics
      dead-letter: dead-letter
    retry:
      max-attempts: 3
      backoff-interval-ms: 1000
  cache:
    url-lookup-ttl-seconds: 3600
    analytics-ttl-seconds: 60
  expiry-sweep:
    interval-ms: 900000
  seed-demo-data: ${SEED_DEMO_DATA:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  show-actuator: false

logging:
  level:
    root: INFO
    com.urlshortener: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
