# Activated via SPRING_PROFILES_ACTIVE=docker (set by docker-compose.yml).
# Host names below resolve to the docker-compose service names on the compose network.
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:urlshortener}
  data:
    redis:
      host: ${REDIS_HOST:redis}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

management:
  endpoint:
    health:
      show-details: always

logging:
  config: classpath:logback-spring.xml
